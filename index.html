<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />

	<title>reveal.js - Bio</title>

	<link rel="stylesheet" href="dist/reveal.css" />
	<link rel="stylesheet" href="dist/theme/white.css" id="theme" />

	<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />

	<style>
		:root {
			--r-main-font: Arial, sans-serif;
			--r-main-font-size: 18px;
			--r-heading-font: Georgia, serif;
			--r-heading1-size: 2.5em;
			--r-heading2-size: 1.8em;
			--r-heading3-size: 1.3em;
			--r-heading-text-transform: none;
		}
	</style>
</head>

<body>
	<div class="reveal">
		<div class="slides">
			<!-- All slide content comes from Markdown: three newlines separate horizontal slides; two dashes separate vertical slides. -->
			<section data-markdown="md_presentations/journal_club_overview.md" data-separator="^\n\n\n"
				data-separator-vertical="^--$">
			</section>

			<!-- DEMO SLIDES DISABLED
To restore: remove this outer comment and change &lt;!-- and --&gt; back to HTML comment delimiters.

			&lt;!-- Slides are separated by three dashes (the default) --&gt;
			<section data-markdown>
				<script type="text/template">
					## Demo 1
					Slide 1
					---
					## Demo 1
					Slide 2
					---
					## Demo 1
					Slide 3
				</script>
			</section>

			&lt;!-- Slides are separated by regexp matching newline + three dashes + newline, vertical slides identical but two dashes --&gt;
			<section data-markdown data-separator="^\n---\n$" data-separator-vertical="^\n--\n$">
				<script type="text/template">
					## Demo 2
					Slide 1.1

					--

					## Demo 2
					Slide 1.2

					---

					## Demo 2
					Slide 2
				</script>
			</section>

			&lt;!-- No "extra" slides, since the separator can't be matched ("---" will become horizontal rulers) --&gt;
			<section data-markdown data-separator="$x">
				<script type="text/template">
					A

					---

					B

					---

					C
				</script>
			</section>

			&lt;!-- Slide attributes --&gt;
			<section data-markdown>
				<script type="text/template">
					&lt;!-- .slide: data-background="#000000" --&gt;
					## Slide attributes
				</script>
			</section>

			&lt;!-- Element attributes --&gt;
			<section data-markdown>
				<script type="text/template">
					## Element attributes
					- Item 1 &lt;!-- .element: class="fragment" data-fragment-index="2" --&gt;
					- Item 2 &lt;!-- .element: class="fragment" data-fragment-index="1" --&gt;
				</script>
			</section>

			&lt;!-- Code --&gt;
			<section data-markdown>
				<script type="text/template">
					```php [1|3-5]
					public function foo()
					{
					    $foo = array(
					        'bar' => 'bar'
					    )
					}
					```
				</script>
			</section>

			&lt;!-- add optional line count offset, in this case 287 --&gt;
			<section data-markdown>
				<script type="text/template">
					## echo.c

					```c [287: 2|4,6]
					/* All of the options in this arg are valid, so handle them. */
					p = arg + 1;
					do {
					    if (*p == 'n')
					        nflag = 0;
					    if (*p == 'e')
					        eflag = '\\';
					} while (*++p);
					```
					[source](https://git.busybox.net/busybox/tree/coreutils/echo.c?h=1_36_stable#n287)
				</script>
			</section>

			&lt;!-- Images --&gt;
			<section data-markdown>
				<script type="text/template">
					![Sample image](https://static.slid.es/logo/v2/slides-symbol-512x512.png)
				</script>
			</section>

			&lt;!-- Math, prettier-ignore --&gt;
			&lt;!-- prettier-ignore --&gt;
			<section data-markdown>
				## The Lorenz Equations
				$$\begin{aligned}
				\dot{x} &amp; = \sigma(y-x) \\
				\dot{y} &amp; = \rho x - y - xz \\
				\dot{z} &amp; = -\beta z + xy
				\end{aligned}$$
			</section>

			&lt;!-- Smartypants --&gt;
			<section data-markdown>
				Turn quotation marks into "curly" 'quotes' with smartypants.
				```javascript
				Reveal.initialize({
					markdown: {
						smartypants: true,
					},
				});
				```
			</section>
			END DISABLED DEMO SLIDES -->

		</div>
	</div>

	<script src="dist/reveal.js"></script>
	<script src="dist/plugin/markdown.js"></script>
	<script src="dist/plugin/highlight.js"></script>
	<script src="dist/plugin/notes.js"></script>
	<script src="dist/plugin/math.js"></script>

	<script>
		Reveal.initialize({
			controls: true,
			progress: true,
			history: true,
			center: false,

			markdown: {
				smartypants: true,
				// The "normal" size of the presentation, aspect ratio will
				// be preserved when the presentation is scaled to fit different
				// resolutions. Can be specified using percentage units.
				width: 900,
				height: 800,

				// Factor of the display size that should remain empty around
				// the content
				margin: 0.04,

				// Bounds for smallest/largest possible scale to apply to content
				minScale: 0.2,
				maxScale: 2.0,
			},

			plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX],
		});
	</script>
</body>

</html>
